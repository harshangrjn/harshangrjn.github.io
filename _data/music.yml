performances:
  - title: Saramaina 2.0
    subtitle: Raga Behag
    description: >
      A contemporary presentation of Swati Tirunal's varnam, with Harsha Nagarajan,
      Akshay Anantapadmanabhan, Mahesh Raghvan, and IndianRaga.
    spotify: https://open.spotify.com/track/6vRCXFxtxch2aYw4jace7z?si=50cd6b58f0f14f41&nd=1&dlsi=3462bb2df0f944be
