# Media coverage, rendered on /media/. Cards fill a three-column grid row by row in the
# order written; the featured card spans two columns and sits last, at the bottom right.
#
#   date     Display date (e.g., "August 2023").
#   outlet   Publication or organization that ran the story.
#   kind     Short label shown next to the date (Award, Feature, Partnership, ...).
#   title    Headline of the story; the whole card links to `url`.
#   url      Primary link to the story. Local copies under /pdf/ are fine.
#   summary  One sentence on what the story covers.
#   area     Optional research-area id from _data/research_areas.yml; sets the card's colour.
#   featured Optional; `true` makes the card two columns wide with a larger headline.
#   links    Optional extra links: label, url, icon (Font Awesome class).

