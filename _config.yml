# =============================================================================
#  Site configuration for harshangrjn.github.io (al-folio v1.2)
#  Most day-to-day edits happen in _data/, _pages/ and _bibliography/ instead.
# =============================================================================

# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: blank # blank = use the full name below
first_name: Harsha
middle_name:
last_name: Nagarajan
contact_note: >
  Email is the best way to reach me.
description: >
  Harsha Nagarajan, Staff Scientist at Los Alamos National Laboratory. Global optimization,
  mixed-integer nonlinear programming, optimization under uncertainty, and learning-accelerated
  optimization, with applications in energy systems, resilient infrastructure, and quantum computing.
footer_text: >
  Built with <a href="https://jekyllrb.com/">Jekyll</a> and the
  <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme. Hosted on
  <a href="https://pages.github.com/">GitHub Pages</a>.
keywords: Harsha Nagarajan, global optimization, mixed-integer nonlinear programming, MINLP, optimization under uncertainty, power systems, energy systems, quantum computing, Los Alamos National Laboratory
lang: en
icon: favicon.svg # file in /assets/img/
apple_touch_icon: apple-touch-icon.png # 180x180 PNG in /assets/img/

url: https://harshangrjn.github.io
baseurl: # leave blank: the site is served from the root of the domain
last_updated: true
impressum_path:
back_to_top: true

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

repo_theme_light: default
repo_theme_dark: dark
protect_email: false

repo_trophies:
  enabled: false
  theme_light: flat
  theme_dark: gitdimmed

external_services:
  github_readme_stats_url: https://github-stats-extended.vercel.app
  github_profile_trophy_url: https://github-profile-trophy.vercel.app

# -----------------------------------------------------------------------------
# al-folio API (v1.x)
# -----------------------------------------------------------------------------

al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false
  features:
    cv:
      enabled: false
    distill:
      enabled: false
  compat:
    bootstrap:
      enabled: false
      support_window: v1.0-v1.2
      deprecates_in: v1.3
      removed_in: v2.0
  upgrade:
    channel: stable
    auto_apply_safe_fixes: false

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: false
search_enabled: false
socials_in_search: false
posts_in_search: false
bib_search: true

max_width: 1040px

# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------

serve_og_meta: true
serve_schema_org: true
og_image: https://harshangrjn.github.io/assets/img/prof_pic.jpg

# -----------------------------------------------------------------------------
# Analytics and search engine verification
# -----------------------------------------------------------------------------

analytics:
  google:
  cronitor:
  pirsch:
  openpanel:
  cloudflare:
enable_simple_analytics: false

google_site_verification:
bing_site_verification:

# -----------------------------------------------------------------------------
# Blog (not used on this site)
# -----------------------------------------------------------------------------

blog_name: Harsha Nagarajan
blog_description:
permalink: /blog/:year/:title/
lsi: false

pagination:
  enabled: false

related_blog_posts:
  enabled: false
  max_related: 5

giscus:
  repo:
  repo_id:
  category: Comments
  category_id:
  mapping: title
  strict: 1
  reactions_enabled: 1
  input_position: bottom
  dark_theme: dark
  light_theme: light
  emit_metadata: 0
  lang: en

disqus_shortname:

external_sources: []

newsletter:
  enabled: false
  endpoint:

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections: {}

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

include: ["_pages"]
exclude:
  # private source documents — never publish these
  - CV_Nagarajan.pdf
  - Nagarajan_Research_Statement_UMich_IOE.pdf
  - academic_website_coding_agent_prompts.md
  # repo tooling and docs
  - MAINTAINING.md
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - al-folio-upgrade-report.md
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - docs/
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - lighthouse_results/
  - node_modules/
  - package.json
  - package-lock.json
  - purgecss.config.js
  - readme_preview/
  - gems/
  - migrations/
  - vendor
keep_files:
  - CNAME
  - .nojekyll

theme: al_folio_core

plugins:
  - jekyll-3rd-party-libraries
  - jekyll-archives-v2
  - jekyll-cache-bust
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials
  - jekyll-tabs
  - jekyll-terser
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji

  # al-folio plugins
  - al_folio_core
  - al_icons
  - al_folio_cv
  - al_folio_distill
  - al_folio_upgrade
  - al_folio_bootstrap_compat
  - al_cookie
  - al_analytics
  - al_citations
  - al_ext_posts
  - al_img_tools
  - al_search
  - al_charts
  - al_math
  - al_comments
  - al_newsletter
  - al_email_protect
  - al_marimo
  - al_rtl

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false
  - scope:
      path: "pdf"
    values:
      sitemap: false

sass:
  style: compressed

# -----------------------------------------------------------------------------
# Jekyll Minifier / Terser
# -----------------------------------------------------------------------------

jekyll-minifier:
  compress_javascript: false
  # Must stay false: re-minifying Tailwind v4 CSS breaks spacing utilities.
  compress_css: false
  exclude: ["robots.txt"]

terser:
  compress:
    drop_console: true

# -----------------------------------------------------------------------------
# Jekyll Archives (no blog posts on this site)
# -----------------------------------------------------------------------------

jekyll-archives:
  posts:
    enabled: []

display_tags: []
display_categories: []

# -----------------------------------------------------------------------------
# Jekyll Scholar — publications come from _bibliography/papers.bib
# -----------------------------------------------------------------------------

scholar:
  last_name: [Nagarajan]
  first_name: [H., Harsha]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_link: Details

  query: "@*"
  group_by: year
  group_order: descending
  sort_by: year, month
  order: descending, descending

enable_publication_badges:
  altmetric: false
  dimensions: false
  google_scholar: false
  inspirehep: false

# Custom BibTeX fields hidden from the "Cite" (BibTeX) box
filtered_bibtex_keywords:
  [
    abbr,
    abstract,
    additional_info,
    altmetric,
    annotation,
    areas,
    arxiv,
    award,
    award_name,
    bibtex_show,
    blog,
    code,
    cvid,
    dimensions,
    eprint,
    featured,
    google_scholar_id,
    hal,
    html,
    inspirehep_id,
    pdf,
    pmid,
    poster,
    preview,
    pubtype,
    selected,
    slides,
    status,
    supp,
    video,
    website,
  ]

max_author_limit: # blank = always show all authors
more_authors_animation_delay: 10
enable_publication_thumbnails: false

# -----------------------------------------------------------------------------
# Jekyll Link Attributes
# -----------------------------------------------------------------------------

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

# -----------------------------------------------------------------------------
# Images
# -----------------------------------------------------------------------------

# Responsive WebP generation needs ImageMagick; the photo is pre-optimized instead.
imagemagick:
  enabled: false
  widths:
    - 480
    - 800
    - 1400
  input_directories:
    - assets/img/
  input_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"
  output_formats:
    webp: "-auto-orient -quality 85"

lazy_loading_images: true

# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------

enable_google_verification: false
enable_bing_verification: false
enable_cookie_consent: false
enable_masonry: false
enable_math: false
enable_tooltips: false
enable_darkmode: true
enable_navbar_social: false
enable_project_categories: false
enable_medium_zoom: false
enable_progressbar: true
enable_video_embedding: false

